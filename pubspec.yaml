name: saiyome
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+9

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^2.6.1
  purchases_flutter: ^8.5.2
  supabase_flutter: ^2.12.0
  shared_preferences: ^2.2.3
  image_picker: ^1.2.1
  wechat_assets_picker: ^10.1.1
  home_widget: ^0.9.1
  app_settings: ^7.0.0
  app_links: ^6.4.1
  intl: ^0.20.2
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  path_provider_foundation: ^2.5.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/usually.png
    - assets/images/o-ba.png
    - assets/images/moudame.png
    - assets/images/leeway.png
    - assets/images/girigiri1.png
    - assets/images/girigiri2.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path_ios: "assets/images/app_icon.png"
  image_path_android: "assets/images/android_icon.png"